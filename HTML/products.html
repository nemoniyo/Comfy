<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Comfy</title>
    <link rel="stylesheet" href="../CSS/products.css">
</head>
<body>
    <header>
        <nav>
            <div class="menuText">
                <p class="homePage">Home</p>
                <p class="productsPage">Products</p>
                <p class="aboutPage">About</p>
            </div>
            <img src="../IMG/comfy (1).png" alt="" class="logo">
            <img src="../IMG/trash (1).png" alt="" class="trash">
        </nav>
        <div class="adress">
            <p>Home / Products</p>
        </div>
    </header>
    <main>
        <aside>
            <div class="searches">
                <input type="text" class="inpSaerch" placeholder="Search...">
                <div class="selectes">
                    <h1>Company</h1>
                    <p class="all">All</p>
                    <p class="ikea">Ikea</p>
                    <p class="marcos">Marcos</p>
                    <p class="caressa">Caressa</p>
                    <p class="liddy">Liddy</p>
                </div>
                <div class="range">
                    <h1>Price</h1>
                    <input type="range" class="inpSaerchPrice">
                    <p class="rangePrice">Value: </p>
                </div>
            </div>
        </aside>
        <div class="box"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../JS/productsMain.js"></script>
</body>
</html>
